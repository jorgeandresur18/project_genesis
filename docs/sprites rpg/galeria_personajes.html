<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Galería de personajes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f1f4;--panel:#fff;--fg:#231c26;--muted:#6b6070;--line:#e0dbe3;--accent:#c8102e;--stage:#e9e5ec;--cA:#ece8ef;--cB:#e2dde6;--onacc:#fff;
--display:"Silkscreen","Courier New",monospace;--body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151218;--panel:#1f1a23;--fg:#efe9f2;--muted:#a397a9;--line:#342c3a;--accent:#ff4a63;--stage:#1a161d;--cA:#221d26;--cB:#2a242f;--onacc:#1a0006;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151218;--panel:#1f1a23;--fg:#efe9f2;--muted:#a397a9;--line:#342c3a;--accent:#ff4a63;--stage:#1a161d;--cA:#221d26;--cB:#2a242f;--onacc:#1a0006;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body)}
.wrap{max-width:1120px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:grid;gap:20px}
h1{font:400 clamp(22px,4vw,32px) var(--display);margin:0;letter-spacing:.02em}header p{margin:4px 0 0;color:var(--muted);max-width:65ch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{display:grid;gap:6px;justify-items:center;text-align:center;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;cursor:pointer;color:var(--fg)}
.card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.card b{font:400 14px var(--display)}.card span{font-size:12px;color:var(--muted)}
.card .pic{background-color:var(--cA);background-image:linear-gradient(45deg,var(--cB) 25%,transparent 25%,transparent 75%,var(--cB) 75%),linear-gradient(45deg,var(--cB) 25%,transparent 25%,transparent 75%,var(--cB) 75%);background-size:12px 12px;background-position:0 0,6px 6px;border-radius:4px;padding:6px;width:100%;min-height:160px;display:grid;place-items:center;box-sizing:border-box}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px}@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.left,.side{display:grid;gap:16px;align-content:start;min-width:0}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;min-height:420px;padding:16px;overflow:hidden;position:relative}
.stage.check{background-color:var(--cA);background-image:linear-gradient(45deg,var(--cB) 25%,transparent 25%,transparent 75%,var(--cB) 75%),linear-gradient(45deg,var(--cB) 25%,transparent 25%,transparent 75%,var(--cB) 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.now{position:absolute;top:10px;left:12px;font:12px var(--display);color:var(--muted)}canvas{image-rendering:pixelated;max-width:100%}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:12px;min-width:0}
.label{font:11px var(--display);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.moves{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}.move{display:grid;gap:2px;justify-items:center;padding:10px 6px}.move b{font:400 13px var(--display)}.move kbd{font:11px var(--mono);color:var(--muted);min-height:1em}
.move[aria-pressed="true"] kbd{color:inherit;opacity:.8}
button{font:600 13px var(--body);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:4px;padding:7px 12px;cursor:pointer}button:hover{border-color:var(--accent)}
button[aria-pressed="true"],button.primary{background:var(--accent);border-color:var(--accent);color:var(--onacc)}.card[aria-pressed="true"]{background:var(--panel);color:var(--fg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}.note{color:var(--muted);font-size:13px;margin:0}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.strip canvas{background:var(--stage);border:1px solid var(--line);border-radius:3px;flex:none;cursor:pointer}.strip canvas.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.stats{display:flex;flex-wrap:wrap;gap:18px;font:13px var(--mono)}.stats b{display:block;font:400 18px var(--display);color:var(--fg)}.stats span{color:var(--muted)}
pre{margin:0;font:12px/1.45 var(--mono);background:var(--stage);border:1px solid var(--line);border-radius:4px;padding:12px;max-height:280px;overflow:auto}.toast{font-size:13px;color:var(--accent);min-height:1em}
</style></head><body><div class="wrap">
<header><h1>Galería de personajes</h1><p id="intro">Cuatro personajes en pixel art con su hoja de sprites lista para el juego. Elige uno para ver todas sus animaciones y copiar el código.</p></header>
<div class="cards" id="cards"></div>
<div class="grid"><div class="left"><div class="stage check" id="stage"><span class="now" id="now"></span><canvas id="cv"></canvas></div><div class="moves" id="moves"></div></div>
<div class="side"><div class="panel"><div class="label" id="cname"></div><p class="note" id="cdesc"></p>
<div class="row"><button id="pause" aria-pressed="false">Pausa</button><button id="flip" aria-pressed="false">Voltear</button><button id="bg" aria-pressed="true">Fondo a cuadros</button></div>
<div class="row"><label for="scale" class="note">Escala</label><input type="range" id="scale" min="1" max="6" value="3"><span id="sv" class="note">3×</span></div>
<div class="row"><label for="speed" class="note">Velocidad</label><input type="range" id="speed" min="25" max="200" step="25" value="100"><span id="spv" class="note">100%</span></div></div>
<div class="panel"><div class="label">Frames de la animación</div><div class="strip" id="strip"></div><div class="stats" id="stats"></div></div>
<div class="panel"><div class="label">Código para tu juego</div><div class="row"><button id="tJs" aria-pressed="true">JavaScript</button><button id="tPy" aria-pressed="false">Pygame</button><button id="tPh" aria-pressed="false">Phaser 3</button><button id="copy" class="primary" style="margin-left:auto">Copiar</button></div>
<pre id="code" tabindex="0"></pre><div class="toast" id="toast" role="status"></div></div></div></div></div>

function camiFx(ctx,img,ATLAS){let cur="idle";
let bounce=1;
const BOUNCE_ANIMS=new Set(["walk","salto","attack","hit"]);   // el rebote solo existe en estas animaciones
const P={y:0,vy:0,x:0,vx:0,y2:0,vy2:0};      // dos "lóbulos" con leve desfase
let prevA=null,prevKey="",lastT=0;
const K=520,C=15;                              // rigidez / amortiguación (≈3.6 Hz, rebota 2–3 veces)
function kick(dy,dx){const g=bounce;P.vy-=dy*g*14;P.vy2-=dy*g*10;P.vx-=dx*g*9}
function stepPhys(dt){
 dt=Math.min(dt,0.033);const n=3,h=dt/n;
 for(let i=0;i<n;i++){
  P.vy+=(-K*P.y-C*P.vy)*h;P.y+=P.vy*h;
  P.vy2+=(-K*0.8*P.y2-C*P.vy2)*h;P.y2+=P.vy2*h;
  P.vx+=(-K*P.x-C*P.vx)*h;P.x+=P.vx*h}
 const m=3.2*Math.max(1,bounce);
 P.y=Math.max(-m,Math.min(m,P.y));P.y2=Math.max(-m,Math.min(m,P.y2));P.x=Math.max(-1.6,Math.min(1.6,P.x))}
function onFrameChange(name,f){
 if(!BOUNCE_ANIMS.has(name)){prevA=null;prevKey=name;P.y=P.vy=P.y2=P.vy2=P.x=P.vx=0;return}
 const A=ANCH[name][f];
 if(prevA&&prevKey===name){
  let dy=A[1]-prevA[1],dx=A[0]-prevA[0];
  dy=Math.max(-14,Math.min(14,dy));dx=Math.max(-4,Math.min(4,dx));
  kick(dy*1.6,dx*0.8)}

const win=(t)=>{t=Math.abs(t);return t>=1?0:Math.pow(Math.cos(t*Math.PI/2),2)};
function applyBounce(name,f){
 const A=ANCH[name][f],RX=11,RY=8,ax=A[0],ay=A[1];
 const x0=ax-RX,y0=ay-RY,w=RX*2+1,h=RY*2+1;
 if(Math.abs(P.y)<0.4&&Math.abs(P.y2)<0.4&&Math.abs(P.x)<0.4)return;
 const src=ctx.getImageData(x0,y0,w,h),out=ctx.createImageData(w,h),s=src.data,o=out.data;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){
  const wx=win((x-RX)/(RX+1)),wy=win((y-RY)/(RY+1)),wt=wx*wy;
  const lobe=x<RX?P.y:P.y2;                   // lóbulo izq / der
  const dy=Math.round(lobe*wt*1.15),dx=Math.round(P.x*wt);

/* ===== Parpadeo en idle y sonrojada =====
   Se toma la región de los ojos de la animación "pestaneo" (frames 6-8: medio cerrado, cerrado, medio abierto)
   y se superpone solo en los píxeles que cambian, así las mejillas sonrojadas quedan intactas. */
const BLINK_ANIMS=new Set(["idle","blush"]);
const BLK={},BL={t:1800,seq:null,i:0,ms:0};
function buildBlink(){
 const c=document.createElement("canvas");c.width=ATLAS.frame_w;c.height=ATLAS.frame_h;
 const x=c.getContext("2d",{willReadFrequently:true}),FW_=ATLAS.frame_w,FH_=ATLAS.frame_h,R=ATLAS.animations.pestaneo.row;
 const get=f=>{x.clearRect(0,0,FW_,FH_);x.drawImage(img,f*FW_,R*FH_,FW_,FH_,0,0,FW_,FH_);return x.getImageData(0,0,FW_,FH_).data};
 const ref=get(4);                                   // pestaneo frame 4 = ojos abiertos (referencia)
 [6,7,8].forEach(f=>{const d=get(f),L=[];
  for(let y=40;y<=52;y++)for(let xx=48;xx<=68;xx++){const i=(y*FW_+xx)*4;
   if(d[i]!==ref[i]||d[i+1]!==ref[i+1]||d[i+2]!==ref[i+2]||d[i+3]!==ref[i+3])L.push([xx,y,"rgb("+d[i]+","+d[i+1]+","+d[i+2]+")"])}
  BLK[f]=L})}
function blinkStep(ms){
 if(!BLINK_ANIMS.has(cur)){BL.seq=null;return}
 if(BL.seq){BL.ms-=ms;
  if(BL.ms<=0){BL.i++;if(BL.i>=BL.seq.length){BL.seq=null;BL.t=2200+Math.random()*3300}else BL.ms=BL.seq[BL.i][1]}}
 else{BL.t-=ms;
  if(BL.t<=0){BL.seq=Math.random()<.22?[[6,70],[7,110],[8,70],[null,120],[6,70],[7,110],[8,70]]:[[6,70],[7,120],[8,70]];BL.i=0;BL.ms=BL.seq[0][1]}}}
function applyBlink(name,f){
 if(!BL.seq)return;const k=BL.seq[BL.i][0];if(k==null)return;
 const dy=(ANCH[name][f][1]-44)-22;                  // compensa el vaivén de la cabeza (referencia: top=22)
 BLK[k].forEach(([x,y,c])=>{ctx.fillStyle=c;ctx.fillRect(x,y+dy,1,1)})}

return{setCur:v=>{cur=v},onFrame:onFrameChange,prevKey:()=>prevKey,stepPhys,blinkStep,build:buildBlink,apply(n,f){if(BOUNCE_ANIMS.has(n))applyBounce(n,f);if(BLINK_ANIMS.has(n))applyBlink(n,f)}}}

const FW = ${W}, FH = ${H};

const sheet = new Image(); sheet.src = '${F}';

class Fighter {
  constructor() { this.anim = 'idle'; this.frame = 0; this.t = 0; this.flip = false; }
  play(name) { if (this.anim !== name) { this.anim = name; this.frame = 0; this.t = 0; } }
  update(dt) {                       // dt en milisegundos
    const a = ANIMS[this.anim];

    while (this.t >= 1000 / a.fps) {
      this.t -= 1000 / a.fps;

  }

    ctx.restore();
  }
}`;
