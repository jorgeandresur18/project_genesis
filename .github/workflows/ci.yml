# CI (docs/CRONOGRAMA.md, «Robustez»): en cada push y pull request a main, revisa tipos, estilo y todas las pruebas
# (también la de rutas). Si algo falla, GitHub lo marca en rojo antes de que llegue al juego publicado.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Estilo (ESLint)
        run: npm run lint
      - name: Pruebas (rutas, batallas, guardado, PayFoe…)
        run: npm test
      - name: Compilación
        run: npx vite build
